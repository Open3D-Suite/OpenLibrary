# What the common Open3D tools need to know about this repository. tools/repo.py reads it:
# tools/check.ps1 runs the checks, "python -I tools/repo.py version set X.Y.Z" writes a new version,
# "python -I tools/repo.py package" makes the release package and "release X.Y.Z" the release.

# Where the version lives (`source`) and the other places that repeat it. Each one is a file and a
# pattern whose one group is the version; "^" is the start of a line.
[version]
source = { file = "CMakeLists.txt", pattern = '^project\(OpenExample VERSION (\d+\.\d+\.\d+)' }
places = [
    { file = "bundle/OpenExample.bundle/PackageContents.xml", pattern = '(?:AppVersion| Version)="([^"]+)"' },
    { file = "README.md", pattern = '^\*\*Version (\d+\.\d+\.\d+)' },
]

# The checks, in the order they run. `full = true` marks the ones that only tools/check.ps1 -Full runs:
# those that need the 3ds Max SDK, 3ds Max, the network or a long time.
# .clang-format-ignore keeps clang-format off the copies of the common files.
[[check]]
name = "clang-format"
run = ["clang-format", "--dry-run", "-Werror"]
files = ["*.cpp", "*.h"]

[[check]]
name = "ruff format"
run = ["ruff", "format", "--check", "."]

[[check]]
name = "ruff check"
run = ["ruff", "check", "."]

# The library and its tests; no 3ds Max needed.
[[check]]
name = "build and tests"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "build.ps1"]

# The plug-in and its bundle: needs the 3ds Max 2027 SDK.
[[check]]
name = "plug-in build"
run = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "build.ps1", "-Plugin"]
full = true

# The release package: dist/openexample-<version>-windows-x64-3dsmax.zip, with OpenExample.bundle at its
# root and LICENSE inside it, and dist/SHA256SUMS.txt. The launcher installs it from there. build.ps1
# -Plugin builds the plug-in (it needs the 3ds Max 2027 SDK) and puts the bundle together in dist/.
[package]
name = "OpenExample"
bundle = "OpenExample.bundle"
build = [["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "build.ps1", "-Plugin", "-Bundle", "dist/OpenExample.bundle"]]
files = [{ from = "dist/OpenExample.bundle", to = "OpenExample.bundle" }]
