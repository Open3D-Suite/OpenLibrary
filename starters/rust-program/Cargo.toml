# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "openexample"
version = "0.1.0"
edition = "2024"
description = "<One sentence: what OpenExample does for a 3D artist>"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[lib]
name = "openexample"
path = "src/lib.rs"

[[bin]]
name = "OpenExample"
path = "src/main.rs"

[dependencies]
# open3d_settings.rs reads and writes settings.json with it.
serde_json = "1"

# build.rs gives the exe its icon and its file version, which the packager checks.
[build-dependencies]
winresource = "0.1"

# The Open3D lints. `unsafe` is denied, not forbidden, because the program calls Windows itself in a few
# places; each of them allows it by name and says why.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
