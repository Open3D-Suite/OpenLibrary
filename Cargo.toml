# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "openlibrary"
version = "0.1.2"
edition = "2024"
description = "A library of 3D models, materials and textures for 3ds Max"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[lib]
name = "openlibrary"
path = "src/lib.rs"

[[bin]]
name = "OpenLibrary"
path = "src/main.rs"

[dependencies]
# open3d_settings.rs reads and writes settings.json with it.
serde_json = "1"
# The caches and the app's settings are JSON, read and written through these types.
serde = { version = "1", features = ["derive"] }
# The window: egui, drawn with OpenGL through eframe.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
# Decodes previews and viewport captures, and writes the thumbnail cache.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "tiff", "tga", "exr", "hdr"] }
# Decodes a large JPEG at a fraction of its size, for the thumbnails.
jpeg-decoder = { version = "0.3", default-features = false }
# Opens the streams that 3ds Max compresses when it saves with "Compress on Save".
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The file and folder dialogs of Windows.
rfd = { version = "0.15", default-features = false }

# build.rs gives the exe its icon and its file version, which the packager checks.
[build-dependencies]
winresource = "0.1"

# The Open3D lints. `unsafe` is denied, not forbidden, because the program calls Windows itself in a few
# places; each of them allows it by name and says why.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
