# What the common Open3D tools need to know about this repository. tools/repo.py reads it:
# tools/check.ps1 runs the checks, "python -I tools/repo.py version set X.Y.Z" writes a new version,
# "python -I tools/repo.py package" makes the release package and "release X.Y.Z" the release.

# Where the version lives (`source`) and the other places that repeat it. Each one is a file and a
# pattern whose one group is the version; "^" is the start of a line.
[version]
source = { file = "Cargo.toml", pattern = '^version = "([^"]+)"' }
places = [
    { file = "Cargo.lock", pattern = '^name = "openlibrary"\nversion = "([^"]+)"' },
    { file = "README.md", pattern = '^\*\*Version ([^*]+)\*\*' },
    { file = "bridge/olib_bridge/__init__.py", pattern = '^VERSION = "([^"]+)"' },
]
# Run after a new version is written: cargo looks Cargo.lock over, without touching the libraries.
after_set = [["cargo", "update", "--workspace", "--offline"]]

# The checks, in the order they run. `full = true` would mark one that only tools/check.ps1 -Full runs:
# one that needs 3ds Max, the network or a long time.
[[check]]
name = "cargo fmt"
run = ["cargo", "fmt", "--all", "--check"]

[[check]]
name = "cargo clippy"
run = ["cargo", "clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"]

[[check]]
name = "cargo test"
run = ["cargo", "test", "--workspace", "--locked"]

[[check]]
name = "bridge tests"
# The bridge that runs inside 3ds Max, tested without it: pymxs and Qt are stood in for.
run = ["python", "-m", "unittest", "discover", "-s", "bridge/tests", "-q"]

[[check]]
name = "ruff format"
run = ["ruff", "format", "--check", "."]

[[check]]
name = "ruff check"
run = ["ruff", "check", "."]

# The release package: dist/openlibrary-<version>-windows-x64.zip, with OpenLibrary.exe at its root, the
# Windows Installer package dist/openlibrary-<version>-windows-x64.msi, which installs the same files into
# C:\Program Files\Open3D\OpenLibrary, and dist/SHA256SUMS.txt. The launcher installs them from there.
[package]
name = "OpenLibrary"
build = [["cargo", "build", "--release", "--locked"]]
# THIRD-PARTY-LICENSES.txt: every library cargo links in, with its licence checked and its texts.
third_party = "cargo"
files = [
    { from = "{cargo_target}/release/OpenLibrary.exe", to = "OpenLibrary.exe" },
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]
exe = "OpenLibrary.exe"
version_answer = "OpenLibrary {version}"

[package.msi]
# Made once for OpenLibrary and never changed: by it Windows knows that a new version replaces the old.
# Until a GUID is written here the packager refuses to make the package. Make one with
#   python -c "import uuid; print(str(uuid.uuid4()).upper())"
upgrade_code = "B6EA25CC-A9DE-4EB7-B9E3-D4953983A83F"
shortcut = "OpenLibrary"
# The icon build.rs gives OpenLibrary.exe, for Installed apps.
icon = "assets/icon.ico"
